<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Expense - Personal Finance Manager</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
}

header {
    background: #dc3545;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 26px;
    font-weight: bold;
}

.container {
    width: 400px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 12px #ccc;
}

h2 {
    text-align: center;
    color: #dc3545;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
}

textarea {
    resize: vertical;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    border: none;
    border-radius: 6px;
    background: #dc3545;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #b02a37;
}

.back {
    background: #555;
}

.back:hover {
    background: #333;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

</style>

</head>

<body>

<header>
    Personal Finance Manager
</header>

<div class="container">

<h2>Add Expense</h2>

<label>Expense From</label>

<select id="expenseFrom">

    <option value="">Select Expense Source</option>

    <option value="Food">Food</option>
    <option value="Rent">Rent</option>
    <option value="Electricity">Electricity</option>
    <option value="Transport">Transport</option>
    <option value="Shopping">Shopping</option>
    <option value="Education">Education</option>
    <option value="Medical">Medical</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Bills">Bills</option>
    <option value="Other">Other</option>

</select>

<label>Category</label>

<select id="category">

    <option value="">Select Category</option>

    <option value="Daily">Daily</option>
    <option value="Monthly">Monthly</option>
    <option value="Education">Education</option>
    <option value="Health">Health</option>
    <option value="Travel">Travel</option>
    <option value="Shopping">Shopping</option>
    <option value="Other">Other</option>

</select>

<label>Amount</label>

<input
    type="number"
    id="amount"
    placeholder="Enter amount"
    min="0"
    step="0.01"
>

<label>Currency</label>

<select id="currency">

    <option value="INR">Indian Rupee (₹)</option>
    <option value="USD">US Dollar ($)</option>
    <option value="EUR">Euro (€)</option>
    <option value="GBP">British Pound (£)</option>

</select>

<label>Date</label>

<input type="date" id="date">

<label>Description</label>

<textarea
    id="description"
    rows="4"
    placeholder="Optional description"></textarea>

<button onclick="saveExpense()">
    Save Expense
</button>

<button class="back" onclick="goDashboard()">
    Back to Dashboard
</button>

<p id="message"></p>

</div>

<script>

function saveExpense() {

    const userId = localStorage.getItem("userId");

    if (!userId) {

        document.getElementById("message").innerText =
            "User not logged in. Please login again.";

        document.getElementById("message").style.color = "red";

        return;
    }

    const expenseFrom =
        document.getElementById("expenseFrom").value;

    const category =
        document.getElementById("category").value;

    const amount =
        document.getElementById("amount").value;

    const currency =
        document.getElementById("currency").value;

    const date =
        document.getElementById("date").value;

    const description =
        document.getElementById("description").value.trim();

    if (expenseFrom === "") {

        alert("Please select Expense From");
        return;

    }

    if (category === "") {

        alert("Please select Category");
        return;

    }

    if (amount === "" || Number(amount) <= 0) {

        alert("Please enter a valid amount");
        return;

    }

    if (date === "") {

        alert("Please select a date");
        return;

    }

    const expense = {

        expenseFrom: expenseFrom,

        category: category,

        amount: Number(amount),

        currency: currency,

        date: date,

        description: description

    };

    fetch("http://localhost:8080/expense/" + userId, {

        method: "POST",

        headers: {

            "Content-Type": "application/json"

        },

        body: JSON.stringify(expense)

    })

    .then(response => {

        if (!response.ok) {

            throw new Error("Failed to save expense");

        }

        return response.json();

    })

    .then(data => {

        document.getElementById("message").innerText =
            "Expense Added Successfully!";

        document.getElementById("message").style.color =
            "green";

        document.getElementById("expenseFrom").value = "";
        document.getElementById("category").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("currency").value = "INR";
        document.getElementById("date").value = "";
        document.getElementById("description").value = "";

        console.log(data);

    })

    .catch(error => {

        document.getElementById("message").innerText =
            "Failed to add expense.";

        document.getElementById("message").style.color =
            "red";

        console.error(error);

    });

}

function goDashboard() {

    window.location.href = "dashboard.html";

}

</script>

</body>

</html>
