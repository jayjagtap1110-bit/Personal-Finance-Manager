<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Saving | Personal Finance Manager</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f2f5f9;
    color: #333;
}

header {
    background: #0d6efd;
    color: white;
    text-align: center;
    padding: 22px;
    font-size: 27px;
    font-weight: bold;
    box-shadow: 0 3px 10px #bbb;
}

.container {
    width: 90%;
    max-width: 500px;
    margin: 40px auto;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #d5d5d5;
}

h2 {
    text-align: center;
    color: #0d6efd;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 5px #c5dcff;
}

textarea {
    resize: vertical;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    border: none;
    border-radius: 7px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.save-btn {
    background: #16a085;
}

.save-btn:hover {
    background: #12816c;
}

.back-btn {
    background: #555;
}

.back-btn:hover {
    background: #333;
}

#message {
    text-align: center;
    margin-top: 18px;
    font-weight: bold;
}

.info-box {
    background: #eaf4ff;
    border-left: 5px solid #0d6efd;
    padding: 14px;
    margin-top: 20px;
    border-radius: 6px;
    color: #24527a;
    font-size: 14px;
}

.goal-info {
    background: #f1f8f5;
    border-left: 5px solid #16a085;
    padding: 14px;
    margin-top: 15px;
    border-radius: 6px;
    display: none;
}

.goal-info p {
    margin: 5px 0;
}

.loading {
    color: #777;
}

.no-goals {
    color: #c0392b;
}

</style>

</head>

<body>

<header>
    Personal Finance Manager
</header>


<div class="container">

<div class="card">

<h2>💰 Add Saving</h2>

<p class="subtitle">
Add money towards one of your saving goals.
</p>


<!-- Saving Goal -->

<label for="savingFor">
    Saving For
</label>

<select
    id="savingFor"
    onchange="showGoalInfo()">

    <option value="">
        -- Loading Goals... --
    </option>

</select>


<!-- Selected Goal Information -->

<div
    class="goal-info"
    id="goalInfo">

    <p>
        <strong>Goal:</strong>
        <span id="selectedGoal"></span>
    </p>

    <p>
        <strong>Target Amount:</strong>
        ₹<span id="targetAmount"></span>
    </p>

    <p>
        <strong>Target Date:</strong>
        <span id="targetDate"></span>
    </p>

</div>


<!-- Saving Amount -->

<label for="amount">
    Saving Amount
</label>

<input
    type="number"
    id="amount"
    placeholder="Enter saving amount"
    min="0"
    step="0.01"
>


<!-- Currency -->

<label for="currency">
    Currency
</label>

<select id="currency">

    <option value="INR">
        Indian Rupee (₹)
    </option>

    <option value="USD">
        US Dollar ($)
    </option>

    <option value="EUR">
        Euro (€)
    </option>

    <option value="GBP">
        British Pound (£)
    </option>

</select>


<!-- Saving Date -->

<label for="date">
    Saving Date
</label>

<input
    type="date"
    id="date"
>


<!-- Description -->

<label for="description">
    Description
</label>

<textarea
    id="description"
    rows="4"
    placeholder="Write a short description (optional)">
</textarea>


<!-- Save -->

<button
    class="save-btn"
    onclick="saveSaving()">

    💾 Save Saving

</button>


<!-- Back -->

<button
    class="back-btn"
    onclick="goDashboard()">

    ← Back to Dashboard

</button>


<p id="message"></p>


<div class="info-box">

<strong>Saving Tip:</strong><br>

First create a goal from <b>Add Goal</b>.
Then select that goal here and enter the amount you want to save.

</div>


</div>

</div>


<script>


/* Logged In User */

const userId =
    localStorage.getItem("userId");


/* Check Login */

if (!userId) {

    alert("Please login first");

    window.location.href =
        "login.html";

}


/* Load Goals */

loadGoals();


function loadGoals() {

    const select =
        document.getElementById("savingFor");


    fetch(
        "http://localhost:8080/saving-goal/user/"
        + userId
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Failed to load goals"
            );

        }

        return response.json();

    })

    .then(goals => {

        select.innerHTML = "";


        /* Default Option */

        const defaultOption =
            document.createElement("option");

        defaultOption.value = "";

        defaultOption.textContent =
            "-- Select Saving Goal --";

        select.appendChild(
            defaultOption
        );


        /* No Goals */

        if (
            !goals ||
            goals.length === 0
        ) {

            const noGoalOption =
                document.createElement("option");

            noGoalOption.value = "";

            noGoalOption.textContent =
                "No goals found - Create a Goal first";

            noGoalOption.disabled = true;

            select.appendChild(
                noGoalOption
            );

            return;

        }


        /* Add Actual Goals */

        goals.forEach(goal => {

            const option =
                document.createElement("option");


            /* IMPORTANT:
               Value is Goal ID */

            option.value =
                goal.id;


            option.textContent =
                "🎯 " + goal.goalName;


            option.dataset.name =
                goal.goalName;


            option.dataset.target =
                goal.targetAmount;


            option.dataset.date =
                goal.targetDate;


            select.appendChild(
                option
            );

        });

    })

    .catch(error => {

        console.error(error);


        select.innerHTML = "";


        const errorOption =
            document.createElement("option");

        errorOption.value = "";

        errorOption.textContent =
            "Unable to load goals";

        select.appendChild(
            errorOption
        );

    });

}


/* Show Selected Goal */

function showGoalInfo() {

    const select =
        document.getElementById("savingFor");


    const selectedOption =
        select.options[
            select.selectedIndex
        ];


    const goalInfo =
        document.getElementById("goalInfo");


    if (
        select.value === "" ||
        !selectedOption.dataset.name
    ) {

        goalInfo.style.display =
            "none";

        return;

    }


    document.getElementById(
        "selectedGoal"
    ).innerText =
        selectedOption.dataset.name;


    document.getElementById(
        "targetAmount"
    ).innerText =
        Number(
            selectedOption.dataset.target
        ).toLocaleString("en-IN");


    document.getElementById(
        "targetDate"
    ).innerText =
        selectedOption.dataset.date;


    goalInfo.style.display =
        "block";

}


/* Save Saving */

function saveSaving() {


    /* Get Goal ID */

    const goalId =
        document.getElementById(
            "savingFor"
        ).value;


    const amount =
        document.getElementById(
            "amount"
        ).value;


    const currency =
        document.getElementById(
            "currency"
        ).value;


    const date =
        document.getElementById(
            "date"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    /* Validation */

    if (goalId === "") {

        showMessage(
            "Please select a saving goal.",
            "red"
        );

        return;

    }


    if (
        amount === "" ||
        Number(amount) <= 0
    ) {

        showMessage(
            "Please enter a valid saving amount.",
            "red"
        );

        return;

    }


    if (date === "") {

        showMessage(
            "Please select a saving date.",
            "red"
        );

        return;

    }


    /* Saving Object */

    const saving = {

        amount:
            Number(amount),

        currency:
            currency,

        date:
            date,

        description:
            description

    };


    /*
       IMPORTANT:
       Send selected GOAL ID
       to backend
    */

    fetch(
        "http://localhost:8080/saving/"
        + userId
        + "/goal/"
        + goalId,
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(saving)

        }

    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Failed to save saving"
            );

        }

        return response.json();

    })

    .then(data => {

        showMessage(
            "Saving Added Successfully! ✅",
            "green"
        );


        /* Clear Form */

        document.getElementById(
            "savingFor"
        ).value = "";


        document.getElementById(
            "amount"
        ).value = "";


        document.getElementById(
            "currency"
        ).value = "INR";


        document.getElementById(
            "date"
        ).value = "";


        document.getElementById(
            "description"
        ).value = "";


        document.getElementById(
            "goalInfo"
        ).style.display =
            "none";


        console.log(
            "Saving Added:",
            data
        );

    })

    .catch(error => {

        console.error(error);

        showMessage(
            "Failed to add saving. Please try again.",
            "red"
        );

    });

}


/* Message */

function showMessage(
    text,
    color
) {

    const message =
        document.getElementById(
            "message"
        );

    message.innerText =
        text;

    message.style.color =
        color;

}


/* Back To Dashboard */

function goDashboard() {

    window.location.href =
        "dashboard.html";

}

</script>


</body>

</html>
