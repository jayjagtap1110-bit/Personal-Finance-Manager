<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View Expense</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

.container {
    width: 90%;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
}

h2 {
    text-align: center;
    color: #dc3545;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

table, th, td {
    border: 1px solid gray;
}

th {
    background: #dc3545;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    text-align: center;
}

.action-btn {
    margin: 3px;
    padding: 7px 12px;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.edit-btn {
    background: orange;
}

.delete-btn {
    background: red;
}

.back-btn {
    margin-top: 20px;
    padding: 10px 20px;
    background: blue;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

#editForm {
    display: none;
    margin-top: 30px;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: #f9f9f9;
}

#editForm input,
#editForm select,
#editForm textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0 15px 0;
    box-sizing: border-box;
}

.save-btn {
    background: green;
    color: white;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

.cancel-btn {
    background: #555;
    color: white;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

</style>

</head>

<body>

<div class="container">

<h2>Expense History</h2>

<table>

<thead>

<tr>
<th>No.</th>
<th>Expense From</th>
<th>Category</th>
<th>Amount</th>
<th>Currency</th>
<th>Date</th>
<th>Description</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="expenseTable">
</tbody>

</table>


<!-- Edit Expense Form -->

<div id="editForm">

<h2>Edit Expense</h2>

<input type="hidden" id="editId">


<label>Expense From</label>

<input
    type="text"
    id="editExpenseFrom"
    placeholder="Enter expense source"
>


<label>Category</label>

<input
    type="text"
    id="editCategory"
    placeholder="Enter category"
>


<label>Amount</label>

<input
    type="number"
    id="editAmount"
    min="0"
    step="0.01"
>


<label>Currency</label>

<select id="editCurrency">

<option value="INR">Indian Rupee (₹)</option>
<option value="USD">US Dollar ($)</option>
<option value="EUR">Euro (€)</option>
<option value="GBP">British Pound (£)</option>

</select>


<label>Date</label>

<input type="date" id="editDate">


<label>Description</label>

<textarea
    id="editDescription"
    rows="4">
</textarea>


<button class="save-btn" onclick="updateExpense()">
Save Changes
</button>

<button class="cancel-btn" onclick="cancelEdit()">
Cancel
</button>

</div>


<button class="back-btn"
        onclick="window.location.href='dashboard.html'">

Back To Dashboard

</button>

</div>


<script>

const userId = localStorage.getItem("userId");


if (!userId) {

    alert("Please login first");

    window.location.href = "login.html";

} else {

    loadExpenses();

}


/* Load Expenses */

function loadExpenses() {

    fetch("http://localhost:8080/expense/user/" + userId)

    .then(response => {

        if (!response.ok) {

            throw new Error("Failed to load expense");

        }

        return response.json();

    })

    .then(data => {

        let table = "";

        data.forEach((expense, index) => {

            table += `

                <tr>

                    <td>${index + 1}</td>

                    <td>${expense.expenseFrom}</td>

                    <td>${expense.category}</td>

                    <td>${expense.amount}</td>

                    <td>${expense.currency}</td>

                    <td>${expense.date}</td>

                    <td>${expense.description || ""}</td>

                    <td>

                        <button
                            class="action-btn edit-btn"
                            onclick='editExpense(${JSON.stringify(expense)})'>

                            Edit

                        </button>

                        <button
                            class="action-btn delete-btn"
                            onclick="deleteExpense(${expense.id})">

                            Delete

                        </button>

                    </td>

                </tr>

            `;

        });


        document.getElementById("expenseTable").innerHTML = table;

    })

    .catch(error => {

        console.error(error);

        document.getElementById("expenseTable").innerHTML = `

            <tr>

                <td colspan="8">

                    Failed to load expense

                </td>

            </tr>

        `;

    });

}


/* Edit Expense */

function editExpense(expense) {

    document.getElementById("editForm").style.display =
        "block";

    document.getElementById("editId").value =
        expense.id;

    document.getElementById("editExpenseFrom").value =
        expense.expenseFrom || "";

    document.getElementById("editCategory").value =
        expense.category || "";

    document.getElementById("editAmount").value =
        expense.amount;

    document.getElementById("editCurrency").value =
        expense.currency;

    document.getElementById("editDate").value =
        expense.date;

    document.getElementById("editDescription").value =
        expense.description || "";

    window.scrollTo({
        top: document.getElementById("editForm").offsetTop,
        behavior: "smooth"
    });

}


/* Update Expense */

function updateExpense() {

    const id =
        document.getElementById("editId").value;

    const updatedExpense = {

        expenseFrom:
            document.getElementById("editExpenseFrom").value.trim(),

        category:
            document.getElementById("editCategory").value.trim(),

        amount:
            Number(document.getElementById("editAmount").value),

        currency:
            document.getElementById("editCurrency").value,

        date:
            document.getElementById("editDate").value,

        description:
            document.getElementById("editDescription").value.trim()

    };


    if (
        updatedExpense.expenseFrom === "" ||
        updatedExpense.category === "" ||
        updatedExpense.amount <= 0 ||
        updatedExpense.date === ""
    ) {

        alert("Please enter valid expense details");

        return;

    }


    fetch("http://localhost:8080/expense/" + id, {

        method: "PUT",

        headers: {

            "Content-Type": "application/json"

        },

        body: JSON.stringify(updatedExpense)

    })

    .then(response => {

        if (!response.ok) {

            throw new Error("Failed to update expense");

        }

        return response.json();

    })

    .then(data => {

        alert("Expense Updated Successfully!");

        document.getElementById("editForm").style.display =
            "none";

        loadExpenses();

    })

    .catch(error => {

        console.error(error);

        alert("Failed to update expense");

    });

}


/* Delete Expense */

function deleteExpense(id) {

    const confirmDelete =
        confirm("Are you sure you want to delete this expense?");


    if (!confirmDelete) {

        return;

    }


    fetch("http://localhost:8080/expense/" + id, {

        method: "DELETE"

    })

    .then(response => {

        if (!response.ok) {

            throw new Error("Failed to delete expense");

        }

        return response.text();

    })

    .then(data => {

        alert("Expense Deleted Successfully!");

        loadExpenses();

    })

    .catch(error => {

        console.error(error);

        alert("Failed to delete expense");

    });

}


/* Cancel Edit */

function cancelEdit() {

    document.getElementById("editForm").style.display =
        "none";

}

</script>

</body>

</html>
